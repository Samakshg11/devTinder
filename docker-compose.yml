services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./src:/app/src
    dns:
      - 1.1.1.1
      - 1.0.0.1
    restart: always

  frontend:
    build:
      context: ../DevTinder-web
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always
